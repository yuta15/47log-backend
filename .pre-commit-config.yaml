minimum_pre_commit_version: "4.6.0"

repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: make lint
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: make format-check
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: make typecheck
        language: system
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: make imports
        language: system
        pass_filenames: false
      - id: complexity
        name: complexity
        entry: make complexity
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: make test
        language: system
        pass_filenames: false
