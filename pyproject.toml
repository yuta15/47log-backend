[project]
name = "47log-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.104",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "-ra --cov=src --cov-report=term-missing:skip-covered"
markers = [
    "integration: DynamoDB Local を必要とする統合テスト",
]
pythonpath = ["."]
testpaths = ["tests/unit"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "Management modules have one-way layers"
type = "layers"
containers = [
    "src.modules.user_management",
    "src.modules.visit_management",
]
layers = ["infra", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Management modules are independent"
type = "independence"
modules = [
    "src.modules.user_management",
    "src.modules.visit_management",
]
